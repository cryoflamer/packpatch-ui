[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packpatch-ui"
version = "0.1.0"
description = "Desktop UI for creating repo packs and applying PackPatch patches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
packpatch-ui = "packpatch_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packpatch_ui*"]

[tool.ruff]
line-length = 120
